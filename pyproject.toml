[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-security"
version = "0.1.0"
description = "Security policy engine + monitoring + anomaly detection for AI agent platforms"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yantrikos"}]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/yantrikos/guardian"

[project.scripts]
guardian = "guardian_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian_engine*"]
